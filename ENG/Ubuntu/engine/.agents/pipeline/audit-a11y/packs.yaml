# Manifest of the thematic packs for the accessibility audit (RGAA 4.1.2).
#
# Read by Audit-A11Y-RGAA.py at startup: editing THIS file is enough to
# adjust the routing of the passes (the scripts are distributed as binaries — all the
# variable content lives in external files such as this one).
#
# Fields of each pack:
#   id / slug / nom : identity; the pack's grid file is packs/T<id:02d>-<slug>.md
#   criteres        : numbers of the RGAA criteria covered — this is the EXACT set
#                     expected in the '## Verdicts' section of each pass of this pack
#   toujours        : true = this pack's SOCLE pass is guaranteed even without any trigger
#                     (the ABSENCE of the patterns there is itself a potential finding)
#   sondes          : quasi-certain NC probes detectable by regex (motif, critere,
#                     confiance: quasi-certain | probable | candidat). Dual use:
#                     injected into the pass prompt ("confirm or refute"), and
#                     confronted with the verdicts (positive probe + C verdict ->
#                     "suspicious C verdict" in the appendix). NEVER an automatic verdict.
#   testabilite     : mapping criterion -> static | partial | manual, COPIED from the
#                     suffixes of the packs/T*.md grids (the editorial source of truth).
#                     Enforced by the aggregation: a C verdict on a "manual" criterion
#                     is requalified as AVM (C not provable statically). MANDATORY and
#                     complete block (validated when the manifest is loaded).
#   declencheurs    : Python regular expressions (case-insensitive) searched for in
#                     the CONTENT of the files of a compartment (socle, composants,
#                     zone); at least one match in the compartment => pass activated.
#                     A pack with no match anywhere is audited NOWHERE:
#                     its criteria are mechanically declared NA (reason in the appendix).
#
# Regex writing note: the dot deliberately replaces the quote in patterns such as
# type=.image (matches type="image and type='image) — more robust to YAML and to
# writing variations.

version: "rgaa-4.1.2"
packs:
  - id: 1
    slug: "images"
    nom: "Images"
    criteres: ["1.1", "1.2", "1.3", "1.4", "1.5", "1.6", "1.7", "1.8", "1.9"]
    testabilite:
      "1.1": "static"
      "1.2": "static"
      "1.3": "partial"
      "1.4": "partial"
      "1.5": "partial"
      "1.6": "partial"
      "1.7": "manual"
      "1.8": "partial"
      "1.9": "static"
    toujours: false
    declencheurs:
      - '<img\b'
      - '<picture\b'
      - '<area\b'
      - '<svg\b'
      - '<canvas\b'
      - 'type=.image'
      - 'role=.img'
      - '<embed\b'
      - '<object\b'
      - 'background(-image)?\s*:[^;{}]*url\('
      - '\.(png|jpe?g|gif|webp|avif)\b'
      - '<(Image|Img|Icon|Avatar|Logo)\b'

  - id: 2
    slug: "cadres"
    nom: "Frames"
    criteres: ["2.1", "2.2"]
    testabilite:
      "2.1": "static"
      "2.2": "partial"
    toujours: false
    sondes:
      - motif: '<iframe(?![^>]{0,200}title=)[^>]*>'
        critere: "2.1"
        confiance: "probable"
    declencheurs:
      - '<i?frame\b'

  - id: 3
    slug: "couleurs"
    nom: "Colours"
    criteres: ["3.1", "3.2", "3.3"]
    testabilite:
      "3.1": "partial"
      "3.2": "partial"
      "3.3": "partial"
    toujours: true
    declencheurs:
      - 'color\s*:'
      - 'background'
      - 'rgba?\('
      - 'hsla?\('
      - '#[0-9a-fA-F]{6}\b'
      - '(text|bg|border)-(red|green|blue|gray|grey|slate|zinc|amber|yellow|orange|purple|pink|indigo|emerald|teal|cyan|sky|rose|neutral|stone|lime|violet|fuchsia)'
      - 'style='

  - id: 4
    slug: "multimedia"
    nom: "Multimedia"
    criteres: ["4.1", "4.2", "4.3", "4.4", "4.5", "4.6", "4.7", "4.8", "4.9", "4.10", "4.11", "4.12", "4.13"]
    testabilite:
      "4.1": "partial"
      "4.2": "manual"
      "4.3": "partial"
      "4.4": "manual"
      "4.5": "partial"
      "4.6": "manual"
      "4.7": "partial"
      "4.8": "partial"
      "4.9": "manual"
      "4.10": "static"
      "4.11": "partial"
      "4.12": "partial"
      "4.13": "partial"
    toujours: false
    sondes:
      - motif: '<(video|audio)[^>]{0,200}autoplay(?![^>]{0,200}muted)'
        critere: "4.10"
        confiance: "probable"
    declencheurs:
      - '<(video|audio|track|bgsound)\b'
      - '\.(mp4|webm|ogv|ogg|mp3|wav|m4a|m3u8)\b'
      - '(youtube|youtu\.be|vimeo|dailymotion|soundcloud|videojs|video-js|jwplayer|plyr)'
      - 'autoplay'
      - '<(Video|Audio|Player|ReactPlayer)\b'

  - id: 5
    slug: "tableaux"
    nom: "Tables"
    criteres: ["5.1", "5.2", "5.3", "5.4", "5.5", "5.6", "5.7", "5.8"]
    testabilite:
      "5.1": "partial"
      "5.2": "manual"
      "5.3": "partial"
      "5.4": "static"
      "5.5": "partial"
      "5.6": "static"
      "5.7": "static"
      "5.8": "static"
    toujours: false
    declencheurs:
      - '<(table|thead|tbody|tfoot|th|caption)\b'
      - 'role=.(grid|table|row\b|columnheader|rowheader)'
      - '<(DataGrid|DataTable|Table)\b'

  - id: 6
    slug: "liens"
    nom: "Links"
    criteres: ["6.1", "6.2"]
    testabilite:
      "6.1": "partial"
      "6.2": "static"
    toujours: false
    declencheurs:
