      "7.2": "partial"
      "7.3": "static"
      "7.4": "static"
      "7.5": "static"
    toujours: false
    declencheurs:
      - 'addEventListener'
      - '\bon(click|change|input|keydown|keyup|keypress|focus|blur|submit|mouseover|mouseenter)\s*[=(]'
      - 'aria-'
      - 'role='
      - '(useState|useEffect|useRef|v-on:|v-if|v-show|@click|\(click\)|ng-click)'
      - 'tabindex'
      - '<script\b'
      - '<(dialog|details)\b'

  - id: 8
    slug: "elements-obligatoires"
    nom: "Mandatory elements"
    criteres: ["8.1", "8.2", "8.3", "8.4", "8.5", "8.6", "8.7", "8.8", "8.9", "8.10"]
    testabilite:
      "8.1": "static"
      "8.2": "partial"
      "8.3": "static"
      "8.4": "static"
      "8.5": "static"
      "8.6": "partial"
      "8.7": "partial"
      "8.8": "static"
      "8.9": "static"
      "8.10": "static"
    toujours: true
    sondes:
      - motif: '<html(?![^>]{0,200}lang=)[^>]*>'
        critere: "8.3"
        confiance: "probable"
    declencheurs:
      - '<!doctype'
      - '<html\b'
      - '<head\b'
      - '<title\b'
      - '\blang='
      - '\bdir='
      - 'document\.title'
      - '<(Helmet|Head|Title)\b'
      - '(useTitle|useHead|useSeoMeta|setTitle)'
      - '(<center\b|<font\b|<marquee\b|<blink\b|<big\b|<u>|align=|bgcolor=)'

  - id: 9
    slug: "structuration"
    nom: "Structure of information"
    criteres: ["9.1", "9.2", "9.3", "9.4"]
    testabilite:
      "9.1": "static"
      "9.2": "static"
      "9.3": "static"
      "9.4": "static"
    toujours: true
    declencheurs:
      - '<h[1-6]\b'
      - 'role=.heading'
      - 'aria-level'
      - '<(main|nav|header|footer|aside|section|article)\b'
      - '<[ou]l\b'
      - '<dl\b'
      - '<(blockquote|q)\b'
      - 'role=.(list\b|listitem|banner|contentinfo|navigation|complementary)'

  - id: 10
    slug: "presentation"
    nom: "Presentation of information"
    criteres: ["10.1", "10.2", "10.3", "10.4", "10.5", "10.6", "10.7", "10.8", "10.9", "10.10", "10.11", "10.12", "10.13", "10.14"]
    testabilite:
      "10.1": "static"
      "10.2": "partial"
      "10.3": "partial"
      "10.4": "partial"
      "10.5": "partial"
      "10.6": "static"
      "10.7": "static"
      "10.8": "static"
      "10.9": "partial"
      "10.10": "manual"
      "10.11": "partial"
      "10.12": "partial"
      "10.13": "partial"
      "10.14": "static"
    toujours: true
    sondes:
      - motif: 'user-scalable\s*=\s*no'
        critere: "10.4"
        confiance: "quasi-certain"
      - motif: 'maximum-scale\s*=\s*1\b'
        critere: "10.4"
        confiance: "quasi-certain"
      - motif: 'outline\s*:\s*(none|0)'
        critere: "10.7"
        confiance: "candidat"
    declencheurs:
      - 'style='
      - 'class(Name)?='
      - '(font-size|font-weight|line-height|letter-spacing)'
      - '@media'
      - '\d+px\b'
      - '(display|visibility|overflow)\s*:'
      - '\bhidden\b'
      - ':(hover|focus|focus-visible|focus-within)'
      - '(outline|box-shadow)\s*:'
      - '(styled\.|styled\(|css`|emotion|tailwind|@apply)'

  - id: 11
    slug: "formulaires"
    nom: "Forms"
    criteres: ["11.1", "11.2", "11.3", "11.4", "11.5", "11.6", "11.7", "11.8", "11.9", "11.10", "11.11", "11.12", "11.13"]
    testabilite:
      "11.1": "static"
