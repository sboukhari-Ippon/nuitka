# Manifeste des packs thématiques de l'audit d'accessibilité (RGAA 4.1.2).
#
# Lu par Audit-A11Y-RGAA.py au démarrage : modifier CE fichier suffit pour
# ajuster le routage des passes (les scripts sont distribués en binaires — tout le
# contenu variable vit dans des fichiers externes comme celui-ci).
#
# Champs de chaque pack :
#   id / slug / nom : identité ; le fichier de grille du pack est packs/T<id:02d>-<slug>.md
#   criteres        : numéros de critères RGAA couverts — c'est le set EXACT attendu
#                     dans la section '## Verdicts' de chaque passe de ce pack
#   toujours        : true = la passe SOCLE de ce pack est garantie même sans déclencheur
#                     (l'ABSENCE des motifs y est elle-même un constat potentiel)
#   sondes          : indices NC quasi certains détectables par regex (motif, critere,
#                     confiance : quasi-certain | probable | candidat). Double usage :
#                     injectés dans le prompt de la passe (« confirme ou infirme »), et
#                     confrontés aux verdicts (sonde positive + verdict C -> « verdict C
#                     suspect » en annexe). JAMAIS un verdict automatique.
#   testabilite     : mapping critère -> statique | partielle | manuelle, RECOPIÉ depuis
#                     les suffixes des grilles packs/T*.md (source de vérité éditoriale).
#                     Appliqué par l'agrégation : un verdict C sur un critère « manuelle »
#                     est requalifié AVM (C non démontrable statiquement). Bloc
#                     OBLIGATOIRE et complet (validé au chargement du manifeste).
#   declencheurs    : expressions régulières Python (insensibles à la casse) cherchées
#                     dans le CONTENU des fichiers d'un compartiment (socle, composants,
#                     zone) ; au moins un match dans le compartiment => passe activée.
#                     Un pack sans aucun match nulle part n'est audité NULLE PART :
#                     ses critères sont déclarés NA mécaniquement (raison en annexe).
#
# Note d'écriture des regex : le point remplace volontairement le guillemet dans les
# motifs du type type=.image (matche type="image et type='image) — plus robuste au
# YAML et aux variantes d'écriture.

version: "rgaa-4.1.2"
packs:
  - id: 1
    slug: "images"
    nom: "Images"
    criteres: ["1.1", "1.2", "1.3", "1.4", "1.5", "1.6", "1.7", "1.8", "1.9"]
    testabilite:
      "1.1": "statique"
      "1.2": "statique"
      "1.3": "partielle"
      "1.4": "partielle"
      "1.5": "partielle"
      "1.6": "partielle"
      "1.7": "manuelle"
      "1.8": "partielle"
      "1.9": "statique"
    toujours: false
    declencheurs:
      - '<img\b'
      - '<picture\b'
      - '<area\b'
      - '<svg\b'
      - '<canvas\b'
      - 'type=.image'
      - 'role=.img'
      - '<embed\b'
      - '<object\b'
      - 'background(-image)?\s*:[^;{}]*url\('
      - '\.(png|jpe?g|gif|webp|avif)\b'
      - '<(Image|Img|Icon|Avatar|Logo)\b'

  - id: 2
    slug: "cadres"
    nom: "Cadres"
    criteres: ["2.1", "2.2"]
    testabilite:
